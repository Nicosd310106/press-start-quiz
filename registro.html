<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Press Start Quiz - Crear Cuenta</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="stylesheet" href="style.css">
    <script>
        // Si el usuario ya inició sesión, redirigir directamente al juego
        (function() {
            const usuarioActual = localStorage.getItem("press_start_usuario_actual");
            if (usuarioActual) {
                window.location.replace("index.html");
            }
        })();
    </script>
    <style>
        .auth-card {
            max-width: 480px;
            margin: 40px auto;
            background: rgba(15, 15, 25, 0.95);
            border: 3px solid #00feff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 0 25px rgba(0, 254, 255, 0.4);
            text-align: center;
        }
        .title-login {
            color: #00feff;
            font-size: 1.6rem;
            margin-bottom: 10px;
            text-shadow: 0 0 8px #00feff;
        }
        .sub-login {
            color: #ffe600;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            color: #00feff;
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid #00feff;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ffe600;
            border: none;
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 10px #ffe600;
            transition: all 0.2s;
        }
        .btn-submit:hover {
            transform: scale(1.02);
            background: #fff066;
        }
        .alert-msg {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }
        .alert-error { background: rgba(255, 0, 85, 0.2); border: 1px solid #ff0055; color: #ff0055; }
        .alert-success { background: rgba(0, 255, 128, 0.2); border: 1px solid #00ff80; color: #00ff80; }
        .link-alt {
            display: block;
            margin-top: 18px;
            color: #ff0055;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .link-alt:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="game-container">
        <header style="text-align: center; margin-top: 20px;">
            <img src="Logo.png" alt="Logo Press Start Quiz" class="logo-img">
            <h1>Press Start Quiz</h1>
        </header>

        <div class="auth-card">
            <h2 class="title-login">📝 CREAR CUENTA</h2>
            <p class="sub-login">Regístrate para guardar tus puntajes y comprar en la tienda.</p>

            <div id="alert-box" class="alert-msg"></div>

            <form onsubmit="registrarUsuario(event)">
                <div class="form-group">
                    <label for="reg-user">NOMBRE DE JUGADOR (NICKNAME):</label>
                    <input type="text" id="reg-user" required placeholder="Ej: PlayerOne">
                </div>
                <div class="form-group">
                    <label for="reg-pass">CONTRASEÑA:</label>
                    <input type="password" id="reg-pass" required placeholder="Crea una contraseña">
                </div>
                <div class="form-group">
                    <label for="reg-pass-confirm">CONFIRMAR CONTRASEÑA:</label>
                    <input type="password" id="reg-pass-confirm" required placeholder="Repite la contraseña">
                </div>
                <button type="submit" class="btn-submit">🎮 REGISTRARSE</button>
            </form>

            <a href="login.html" class="link-alt">← ¿Ya tienes cuenta? Inicia sesión aquí</a>
        </div>
    </div>

    <script src="sonidos.js" onerror="console.warn('sonidos.js no cargado')"></script>
    <script>
        function registrarUsuario(e) {
            e.preventDefault();
            const user = document.getElementById('reg-user').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const passConfirm = document.getElementById('reg-pass-confirm').value;
            const alertBox = document.getElementById('alert-box');

            if (pass !== passConfirm) {
                if (typeof Sonidos !== 'undefined' && typeof Sonidos.playError === 'function') Sonidos.playError();
                alertBox.innerText = "❌ Las contraseñas no coinciden.";
                alertBox.className = "alert-msg alert-error";
                alertBox.style.display = "block";
                return;
            }

            const users = JSON.parse(localStorage.getItem('press_start_usuarios_db') || '{}');

            if (users[user]) {
                if (typeof Sonidos !== 'undefined' && typeof Sonidos.playError === 'function') Sonidos.playError();
                alertBox.innerText = "❌ El nombre de jugador ya está registrado. Elige otro.";
                alertBox.className = "alert-msg alert-error";
                alertBox.style.display = "block";
                return;
            }

            // Registrar nuevo usuario
            users[user] = {
                password: pass,
                puntos: 0,
                tienda: { mitad: 0, escudo: 0, saltar: 0, doble: 0 }
            };

            localStorage.setItem('press_start_usuarios_db', JSON.stringify(users));
            localStorage.setItem('temp_registered_user', user);

            if (typeof Sonidos !== 'undefined' && typeof Sonidos.playPowerUp === 'function') Sonidos.playPowerUp();

            alertBox.innerText = "🎉 ¡Cuenta creada con éxito! Redirigiendo al login...";
            alertBox.className = "alert-msg alert-success";
            alertBox.style.display = "block";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1200);
        }
    </script>
</body>
</html>
