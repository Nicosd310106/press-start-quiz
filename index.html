<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Press Start Quiz</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const usuarioActual = localStorage.getItem("press_start_usuario_actual");
            if (!usuarioActual) {
                window.location.replace("login.html");
            }
        })();
    </script>
</head>
<body>
    <div class="game-container">
        <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="Logo.png" alt="Logo Press Start Quiz" class="logo-img">
                <h1 style="margin: 0;">Press Start Quiz</h1>
            </div>
            <button class="btn-powerup" onclick="cerrarSesion()" style="background: #ff0055; border-color: #ff0055; width: auto; padding: 6px 14px; font-weight: bold; cursor: pointer;">
                🚪 Salir
            </button>
        </header>

        <div id="menu">
            <!-- PASO 1: Selección de Género -->
            <div id="genre-selection">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <p class="menu-subtitle" style="margin: 0;">Elige el género de videojuegos</p>
                    <a href="tienda.html" class="btn-powerup" style="width: auto; padding: 4px 10px; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer;">
                        🛒 Tienda (<span id="tienda-puntos-menu">0</span> pts)
                    </a>
                </div>
                
                <div class="menu-options" style="max-height: 280px; overflow-y: auto; padding-right: 5px;">
                    <button class="btn-genre" data-genre="Survival Horror">
                        <span class="diff-icon">🧟</span>
                        <span class="diff-label">Survival Horror</span>
                    </button>
                    <button class="btn-genre" data-genre="RPG">
                        <span class="diff-icon">⚔️</span>
                        <span class="diff-label">RPG</span>
                    </button>
                    <button class="btn-genre" data-genre="Acción y Aventura">
                        <span class="diff-icon">🔥</span>
                        <span class="diff-label">Acción y Aventura</span>
                    </button>
                    <button class="btn-genre" data-genre="Shooter">
                        <span class="diff-icon">🎯</span>
                        <span class="diff-label">Shooter / Disparos</span>
                    </button>
                    <button class="btn-genre" data-genre="Lucha">
                        <span class="diff-icon">🥊</span>
                        <span class="diff-label">Lucha / Peleas</span>
                    </button>
                    <button class="btn-genre" data-genre="Plataformas">
                        <span class="diff-icon">🍄</span>
                        <span class="diff-label">Plataformas</span>
                    </button>
                    <button class="btn-genre" data-genre="Estrategia">
                        <span class="diff-icon">♟️</span>
                        <span class="diff-label">Estrategia</span>
                    </button>
                    <button class="btn-genre" data-genre="Simulación">
                        <span class="diff-icon">🏗️</span>
                        <span class="diff-label">Simulación</span>
                    </button>
                    <button class="btn-genre" data-genre="Carreras">
                        <span class="diff-icon">🏎️</span>
                        <span class="diff-label">Carreras</span>
                    </button>
                    <button class="btn-genre" data-genre="Deportes">
                        <span class="diff-icon">⚽</span>
                        <span class="diff-label">Deportes</span>
                    </button>
                </div>

                <!-- TABLA DE POSICIONES / RANKING INTEGRADA -->
                <div id="ranking-container" style="margin-top: 15px; border: 1px solid #00feff; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.4);">
                    <h3 style="color: #ffe600; margin: 0 0 8px 0; text-align: center; font-size: 1rem;">🏆 TOP 10 JUGADORES (RANKING)</h3>
                    <ol id="ranking-lista" style="padding-left: 20px; color: #fff; font-size: 0.85rem; margin: 0;">
                        <li>Cargando posiciones...</li>
                    </ol>
                </div>
            </div>

            <!-- PASO 2: Selección de Dificultad -->
            <div id="difficulty-selection" style="display: none;">
                <p class="menu-subtitle">Género: <span id="selected-genre-label" style="color: #ff0055;"></span></p>
                <p class="menu-subtitle">Elige tu dificultad</p>
                <div class="menu-options">
                    <button class="btn-difficulty" data-level="Fácil">
                        <span class="diff-icon">★</span>
                        <span class="diff-label">Fácil</span>
                        <span class="diff-desc">Para calentar motores</span>
                    </button>
                    <button class="btn-difficulty" data-level="Media">
                        <span class="diff-icon">★★</span>
                        <span class="diff-label">Media</span>
                        <span class="diff-desc">Para jugadores casuales</span>
                    </button>
                    <button class="btn-difficulty" data-level="Difícil">
                        <span class="diff-icon">★★★</span>
                        <span class="diff-label">Difícil</span>
                        <span class="diff-desc">Solo para veteranos</span>
                    </button>
                    <button class="btn-difficulty btn-todas" data-level="Todas">
                        <span class="diff-icon">🎮</span>
                        <span class="diff-label">Todas</span>
                        <span class="diff-desc">Mezcla de todo nivel</span>
                    </button>
                    <button class="btn-difficulty btn-infinite" data-level="Infinito" style="border-color: #ffe600;">
                        <span class="diff-icon">♾️</span>
                        <span class="diff-label" style="color: #ffe600;">Modo Infinito</span>
                        <span class="diff-desc">¡Juega hasta fallar!</span>
                    </button>
                </div>
                <button id="btn-back-genre" class="btn-option" style="margin-top: 15px;">← Cambiar Género</button>
            </div>
        </div>

        <div id="game" style="display: none;">
            <!-- HUD Superior del Juego con Botón de Guardar Progreso -->
            <div id="status" style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px;">
                <span id="difficulty-badge">Fácil</span>
                <span id="score-display">Puntos: 0</span>
                <button id="btn-guardar-progreso" class="btn-powerup" onclick="guardarProgresoManual()" style="background: #00feff; color: #000; border-color: #00feff; font-weight: bold; width: auto; padding: 4px 10px; cursor: pointer;">
                    💾 Guardar Progreso
                </button>
            </div>

            <!-- HUD de Comodines en Partida -->
            <div id="shop-hud" style="margin-bottom: 10px; display: flex; gap: 4px; justify-content: center;">
                <button id="btn-powerup-mitad" class="btn-powerup" onclick="usarComodin('mitad')">✂️ 50/50 (<span id="cant-mitad">0</span>)</button>
                <button id="btn-powerup-escudo" class="btn-powerup" onclick="usarComodin('escudo')">🛡️ Escudo (<span id="cant-escudo">0</span>)</button>
                <button id="btn-powerup-saltar" class="btn-powerup" onclick="usarComodin('saltar')">⏭️ Saltar (<span id="cant-saltar">0</span>)</button>
                <button id="btn-powerup-doble" class="btn-powerup" onclick="usarComodin('doble')">✨ x2 Pts (<span id="cant-doble">0</span>)</button>
            </div>

            <!-- Indicador de Precarga de Modo Infinito -->
            <div id="infinite-loader" style="display: none; font-size: 0.75rem; color: #ffe600; margin-bottom: 8px;">
                ⚡ Cargando más preguntas en segundo plano...
            </div>

            <main id="quiz">
                <h2 id="question">Cargando pregunta...</h2>
                <div id="options-container"></div>
            </main>

            <div id="game-over-screen" style="display: none;">
                <h2>GAME OVER</h2>
                <p>Tu puntuación final: <span id="score-over">0</span></p>
                <div style="margin: 15px 0;">
                    <button class="btn-powerup" onclick="guardarProgresoManual()" style="background: #00feff; color: #000; border-color: #00feff; font-weight: bold; width: 100%; padding: 8px 12px; margin-bottom: 10px; cursor: pointer;">
                        💾 Guardar Puntos en la BD
                    </button>
                </div>
                <button onclick="volverAlMenu()" class="btn-retry">INSERT COIN (VOLVER AL MENÚ)</button>
            </div>

            <div id="message"></div>
        </div>
    </div>

    <!-- Carga defensiva y ordenada de scripts -->
    <script src="sonidos.js" onerror="console.warn('sonidos.js no cargado')"></script>
    <script src="tienda.js" onerror="console.warn('tienda.js no cargado')"></script>
    <script src="modo-infinito.js" onerror="console.warn('modo-infinito.js no cargado')"></script>
    <script src="script.js"></script>
</body>
</html>
