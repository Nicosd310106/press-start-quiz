<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Press Start Quiz - Iniciar Sesión</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-card {
            max-width: 480px;
            margin: 40px auto;
            background: rgba(15, 15, 25, 0.95);
            border: 3px solid #00feff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 0 25px rgba(0, 254, 255, 0.4);
            text-align: center;
        }
        .title-login {
            color: #00feff;
            font-size: 1.6rem;
            margin-bottom: 10px;
            text-shadow: 0 0 8px #00feff;
        }
        .sub-login {
            color: #ffe600;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            color: #00feff;
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid #00feff;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ffe600;
            border: none;
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 10px #ffe600;
            transition: all 0.2s;
        }
        .btn-submit:hover {
            transform: scale(1.02);
            background: #fff066;
        }
        .alert-msg {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }
        .alert-error { background: rgba(255, 0, 85, 0.2); border: 1px solid #ff0055; color: #ff0055; }
        .alert-success { background: rgba(0, 255, 128, 0.2); border: 1px solid #00ff80; color: #00ff80; }
        .link-alt {
            display: block;
            margin-top: 18px;
            color: #ff0055;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .link-alt:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="game-container">
        <header style="text-align: center; margin-top: 20px;">
            <img src="Logo.png" alt="Logo Press Start Quiz" class="logo-img">
            <h1>Press Start Quiz</h1>
        </header>

        <div class="auth-card">
            <h2 class="title-login">🔑 INICIAR SESIÓN</h2>
            <p class="sub-login">Ingresa tus datos para acceder a tu perfil y jugar.</p>

            <div id="alert-box" class="alert-msg"></div>

            <form onsubmit="iniciarSesion(event)">
                <div class="form-group">
                    <label for="login-user">NOMBRE DE JUGADOR:</label>
                    <input type="text" id="login-user" required placeholder="Tu nickname">
                </div>
                <div class="form-group">
                    <label for="login-pass">CONTRASEÑA:</label>
                    <input type="password" id="login-pass" required placeholder="Tu contraseña">
                </div>
                <button type="submit" class="btn-submit">🚀 INICIAR SESIÓN Y JUGAR</button>
            </form>

            <a href="index.html" class="link-alt">← ¿No tienes cuenta aún? Crea una aquí</a>
        </div>
    </div>

    <script src="sonidos.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const tempUser = localStorage.getItem('temp_registered_user');
            if (tempUser) {
                document.getElementById('login-user').value = tempUser;
                localStorage.removeItem('temp_registered_user');
            }
        });

        function iniciarSesion(e) {
            e.preventDefault();
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value;
            const alertBox = document.getElementById('alert-box');

            const users = JSON.parse(localStorage.getItem('press_start_usuarios_db') || '{}');

            if (!users[user] || users[user].password !== pass) {
                if (typeof Sonidos !== 'undefined') Sonidos.playError();
                alertBox.innerText = "❌ Usuario o contraseña incorrectos.";
                alertBox.className = "alert-msg alert-error";
                alertBox.style.display = "block";
                return;
            }

            localStorage.setItem('press_start_usuario_actual', user);

            if (typeof Sonidos !== 'undefined') Sonidos.playPowerUp();

            alertBox.innerText = "🎮 ¡Sesión iniciada correctamente! Entrando al juego...";
            alertBox.className = "alert-msg alert-success";
            alertBox.style.display = "block";

            // Redirige al juego
            setTimeout(() => {
                window.location.href = "juego.html";
            }, 1000);
        }
    </script>
</body>
</html>
